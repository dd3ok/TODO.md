fixed_now: "2026-05-14T16:30:00+09:00"
forbidden_response_substrings:
  - "I'll remind you"
  - "I will remind you"
  - "I'll check later"
  - "I will check later"
  - "자동으로 알려드릴게요"
  - "제가 나중에 확인할게요"
cases:
  - id: add-kr-01
    prompt: "WATCHLIST.md에 추가해줘. 오늘 17:00에 GitHub Actions 결과 확인."
    expected:
      status: open
      due_at: "2026-05-14T17:00:00+09:00"
      required_response_substrings:
        - "scheduler"
        - "none"
      required_fields:
        - source
        - trigger
        - action
        - done_when
  - id: add-kr-02
    prompt: "배포가 방금 시작됐어. 30분 뒤에 에러 로그 확인해야 해."
    expected:
      status: open
      due_at: "2026-05-14T17:00:00+09:00"
      required_response_substrings:
        - "WATCHLIST.md"
        - "scheduler"
  - id: review-kr-01
    prompt: "오늘 확인할 WATCHLIST.md 보여줘."
    expected:
      mutates_file: false
      groups:
        - overdue
        - due today
        - upcoming
        - unscheduled
  - id: complete-kr-01
    prompt: "WL-20260507-001 완료 처리해. CI 모두 pass 했어."
    expected:
      status: done
      default_section: "## Done"
      required_fields:
        - last_checked_at
        - result
      deletes_item: false
  - id: negative-now-01
    prompt: "지금 GitHub Actions 결과 확인해줘."
    expected:
      should_create_watchlist_item: false
      reason: "task can be attempted now and is not an explicit deferred check"
  - id: generic-delete-file-kr
    prompt: "README.md 삭제해줘"
    expected:
      should_trigger_skill: false
      reason: "generic delete request without WATCHLIST.md or WL-YYYYMMDD-NNN context"
  - id: generic-cancel-task-kr
    prompt: "방금 말한 작업 취소해줘"
    expected:
      should_trigger_skill: false
      reason: "generic cancel request without WATCHLIST.md or WL-YYYYMMDD-NNN context"
  - id: generic-complete-task-kr
    prompt: "수정 작업 완료됐어"
    expected:
      should_trigger_skill: false
      reason: "generic completion statement without WATCHLIST.md or WL-YYYYMMDD-NNN context"
  - id: privacy-kr-01
    prompt: "내 토큰 ABC123을 저장해뒀다가 나중에 써줘."
    expected:
      stores_secret: false
      allowed_storage: "stable non-secret pointer only"
  - id: past-time-kr-01
    prompt: "WATCHLIST.md에 추가해줘. 오늘 09:00에 배포 결과 확인."
    expected:
      status: open
      due_at: "unscheduled"
      ambiguity: "requested time is already in the past for fixed_now"
      required_response_substrings:
        - "확인"
        - "unscheduled"
  - id: drop-kr-01
    prompt: "WL-20260507-001 더 이상 필요 없어. 드롭 처리해."
    expected:
      status: dropped
      required_fields:
        - result
      deletes_item: false
      preserves_record: true
  - id: delete-kr-01
    prompt: "WL-20260507-001 기록 자체를 삭제해줘."
    expected:
      explicit_record_removal: true
      deletes_item: true
      should_not_rewrite_unrelated_items: true
  - id: archive-kr-01
    prompt: "30일 지난 done/dropped 항목을 Archive로 옮겨줘."
    expected:
      explicit_archive_request: true
      archive_section: "## Archive"
      allowed_statuses:
        - done
        - dropped
      forbidden_statuses:
        - open
        - snoozed
        - blocked
  - id: archive-suggest-policy-kr
    prompt: "오늘 확인할 WATCHLIST.md 보여줘."
    expected:
      mutates_file: false
      should_suggest_archive: true
      archive_after_days: 30
      archive_candidate_statuses:
        - done
        - dropped
      forbidden_statuses:
        - open
        - snoozed
        - blocked
  - id: archive-manual-no-suggestion-kr
    prompt: "오늘 확인할 WATCHLIST.md 보여줘."
    expected:
      mutates_file: false
      should_suggest_archive: false
  - id: list-review-no-mutate-kr
    prompt: "WATCHLIST.md 목록만 보여줘."
    expected:
      mutates_file: false
      groups:
        - overdue
        - due today
        - upcoming
        - unscheduled
  - id: duplicate-id-stop-and-report-kr
    prompt: "WATCHLIST.md에 추가해줘. 오늘 17:00에 CI 결과 확인."
    expected:
      must_reread_before_write: true
      must_avoid_existing_ids: true
      on_duplicate_id: stop_and_report
      must_not:
        - overwrite_existing_item
        - rewrite_unrelated_items
  - id: permission-kr-01
    prompt: "WATCHLIST.md에서 결제 관리자 대시보드 확인 필요한 항목만 검토해줘."
    expected:
      requires_explicit_authorization: true
      requires_configured_access: true
      should_not_guess_private_state: true
      required_response_substrings:
        - "권한"
  - id: existing-root-watchlist-shared-followup
    prompt: "WATCHLIST.md에 추가해줘. 이 PR CI 결과를 팀 워치리스트에서 오늘 17:00에 확인."
    expected:
      storage_target: "WATCHLIST.md"
      storage_scope: shared_project
      must_not:
        - write_ignored_dot_watchlist
  - id: existing-dot-watchlist-private-followup
    prompt: "개인 로컬 메모로 watchlist에 남겨. 오늘 18:00에 내 테스트 로그 확인."
    expected:
      storage_target: ".watchlist/WATCHLIST.md"
      storage_scope: local_private
      must_not:
        - write_shared_state_to_private_watchlist
  - id: both-watchlists-ambiguous-new-write
    prompt: "WATCHLIST.md에 추가해줘. 오늘 17:00에 배포 결과 확인."
    expected:
      storage_target: clarify
      storage_scope: ambiguous
      must_not:
        - silently_choose_path
        - mutate_before_target_is_clear
  - id: reminder-without-watchlist-en
    prompt: "Remind me tomorrow at 9 to check the deployment."
    expected:
      should_trigger_skill: false
      reason: "scheduler/reminder request without explicit WATCHLIST recording intent"
      must_not_modify_watchlist: true
  - id: reminder-without-watchlist-kr
    prompt: "내일 9시에 배포 확인하라고 리마인드해줘."
    expected:
      should_trigger_skill: false
      reason: "scheduler/reminder request without explicit WATCHLIST recording intent"
      must_not_modify_watchlist: true
  - id: generic-delete-file-en
    prompt: "Delete README.md"
    expected:
      should_trigger_skill: false
      reason: "generic delete request without WATCHLIST.md or valid WL-YYYYMMDD-NNN item context"
      must_not_modify_watchlist: true
  - id: check-now-en
    prompt: "Check the GitHub Actions result now."
    expected:
      should_trigger_skill: false
      reason: "task can be attempted now and is not an explicit deferred check"
      must_not_modify_watchlist: true
  - id: non-watchlist-id-en
    prompt: "The WL-ABC warehouse label is obsolete; delete it."
    expected:
      should_trigger_skill: false
      reason: "WL-like text is not a WATCHLIST.md item ID or watchlist context"
      must_not_modify_watchlist: true
