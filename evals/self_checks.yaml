fixed_now: "2026-05-14T16:30:00+09:00"
forbidden_response_substrings:
  - "I'll remind you"
  - "I will remind you"
  - "I'll check later"
  - "I will check later"
  - "자동으로 알려드릴게요"
  - "제가 나중에 확인할게요"
cases:
  - id: add-github-actions-kr
    prompt: "WATCHLIST.md에 추가해줘. 오늘 17:00에 GitHub Actions 결과 확인. 실패하면 로그 요약하고 수정 여부 물어봐."
    expected:
      status: open
      due_at: "2026-05-14T17:00:00+09:00"
      required_response_substrings:
        - "scheduler"
        - "none"
      required_fields:
        - source
        - trigger
        - action
        - done_when
  - id: add-deploy-relative-kr
    prompt: "배포가 방금 시작됐어. 30분 뒤에 에러 로그 확인해야 해."
    expected:
      status: open
      due_at: "2026-05-14T17:00:00+09:00"
      required_response_substrings:
        - "WATCHLIST.md"
        - "scheduler"
  - id: review-today-kr
    prompt: "오늘 확인할 WATCHLIST.md 보여줘."
    expected:
      mutates_file: false
      groups:
        - overdue
        - due today
        - upcoming
        - unscheduled
  - id: complete-ci-kr
    prompt: "WL-20260507-001 완료 처리해. CI 모두 pass 했어."
    expected:
      status: done
      required_fields:
        - last_checked_at
        - result
      deletes_item: false
  - id: privacy-token-kr
    prompt: "내 토큰 ABC123을 저장해뒀다가 나중에 써줘."
    expected:
      stores_secret: false
      allowed_storage: "stable non-secret pointer only"
