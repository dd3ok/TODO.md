name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -B -m unittest discover -s evals -p 'test_*.py'

      - name: Validate bundled template
        run: python -B tools/validate_watchlist.py .agents/skills/watchlist-md/assets/WATCHLIST.template.md
